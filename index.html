<body>

    <!-- TOP BAR -->
    <div class="topbar">
        <div class="tb-left">
            <h1>&#127959; Meridian Construction Company</h1>
            <p>Income &amp; Expenditure — Site Manager</p>
        </div>
        <div class="tb-right">
            <span class="saved-badge" id="saveBadge">&#10003; Saved</span>
            <button class="btn btn-green" onclick="toggleAddSite()">+ Add Site</button>
            <button class="btn btn-amber" onclick="exportExcel()">&#8595; Export Excel</button>
            <button class="btn btn-red" style="font-size:11px" onclick="clearAllData()">Reset Data</button>
        </div>
    </div>

    <!-- NAV TABS -->
    <div class="nav-tabs">
        <div class="nav-tab on" id="nt-dash" onclick="showTab('dash')">&#9632; Dashboard</div>
        <div class="nav-tab" id="nt-sites" onclick="showTab('sites')">&#9776; All Sites</div>
    </div>

    <!-- MAIN -->
    <div class="main">

        <!-- ADD SITE BAR -->
        <div class="add-site-bar" id="addSiteBar">
            <div class="fi" style="flex:1"><label>New Site Name</label><input type="text" id="newSiteName"
                    placeholder="e.g. Site 21 — Kavya Residency" onkeydown="if(event.key==='Enter')addSite()"></div>
            <button class="btn btn-green" onclick="addSite()">Add</button>
            <button class="btn btn-grey" onclick="toggleAddSite()">Cancel</button>
        </div>

        <!-- DASHBOARD VIEW -->
        <div id="view-dash">
            <div class="dash-cards" id="dashCards"></div>
            <div class="dash-tbl-wrap">
                <div class="dash-tbl-hdr">All Sites — Income &amp; Expenditure Summary</div>
                <table class="dash-tbl">
                    <thead>
                        <tr>
                            <th style="width:28%">Site</th>
                            <th>Receipts (&#8377;)</th>
                            <th>Expense (&#8377;)</th>
                            <th>Profit 15% (&#8377;)</th>
                            <th>Balance (&#8377;)</th>
                        </tr>
                    </thead>
                    <tbody id="dashBody"></tbody>
                </table>
            </div>
        </div>

        <!-- SITES VIEW -->
        <div id="view-sites" style="display:none">
            <div class="sites-list" id="sitesList"></div>
        </div>

    </div>

    <!-- EDIT ENTRY OVERLAY -->
    <div class="edit-overlay" id="editOverlay">
        <div class="edit-box">
            <h3 id="editTitle">Edit Entry</h3>
            <div class="fi"><label>Date</label><input type="date" id="editDate"></div>
            <div class="fi"><label id="editLbl2">Particulars / Details</label><input type="text" id="editText"></div>
            <div class="fi"><label>Amount (&#8377;)</label><input type="number" id="editAmt"></div>
            <div style="display:flex;gap:8px;margin-top:14px">
                <button class="btn btn-blue" style="flex:1" onclick="saveEdit()">Save Changes</button>
                <button class="btn btn-grey" onclick="closeEdit()">Cancel</button>
            </div>
        </div>
    </div>

    <!-- NOTIFICATION -->
    <div class="notif" id="notif"></div>

    <script>
        // ── CONSTANTS ─────────────────────────────────────────────────────────────────
        const MAT = ['Stone', 'Cement', 'Sand', 'Metal', 'Steel'];
        const LAB = ['Stone Masonry', 'Concrete Mason', 'Man Labor', 'Plastering'];
        const PT = 0.15;
        const STORE_KEY = 'meridian_v1';

        // ── STATE ─────────────────────────────────────────────────────────────────────
        let sites = [];
        let openSite = null;
        let openSec = {};
        let openCat = {};
        let editCtx = null;

        // ── INIT ──────────────────────────────────────────────────────────────────────
        function mkSite(name) {
            return {
                name,
                cash: [],
                mat: Object.fromEntries(MAT.map(c => [c, []])),
                lab: Object.fromEntries(LAB.map(c => [c, { daily: [], contract: null, scName: '', scDesc: '' }]))
            };
        }

        // ── FIREBASE SYNC ─────────────────────────────────────────────────────────────
        const DB_PATH = 'data/main'; // Single document for all sites (or split if needed)
        let isInitialLoad = true;

        async function load() {
            const b = document.getElementById('saveBadge');
            b.textContent = '⏳ Connecting...';
            
            // Reference to the main data document
            const docRef = window.fsDoc(window.db, "meridian", "dashboard");

            // Real-time listener
            window.fsOnSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    sites = data.sites || [];
                    
                    // Data Migration / Fixes
                    sites.forEach(s => {
                        if (!s.mat) s.mat = Object.fromEntries(MAT.map(c => [c, []]));
                        LAB.forEach(lc => {
                            if (!s.lab) s.lab = {};
                            if (!s.lab[lc]) s.lab[lc] = { daily: [], contract: null, scName: '', scDesc: '' };
                            if (Array.isArray(s.lab[lc])) s.lab[lc] = { daily: s.lab[lc], contract: null, scName: '', scDesc: '' };
                        });
                    });

                    if (isInitialLoad) {
                        isInitialLoad = false;
                        renderDash();
                        if (openSite !== null) renderSites();
                    } else {
                        // Refresh current view if updated by another user
                        if (document.getElementById('view-dash').style.display === 'block') renderDash();
                        else renderSites();
                    }

                    b.textContent = '✓ Cloud Synced';
                    b.style.color = '#7EB4D8';
                } else {
                    // Initialize empty if first time
                    if (isInitialLoad) {
                        isInitialLoad = false;
                        for (let i = 1; i <= 20; i++) sites.push(mkSite('Site ' + i));
                        save(); // Create the doc
                    }
                }
            }, (error) => {
                console.error("Firebase Sync Error:", error);
                notif("Connection Error. Check internet.");
            });
        }

        async function save() {
            const b = document.getElementById('saveBadge');
            b.textContent = '⏳ Saving...';
            b.style.color = '#fbc02d';

            try {
                const docRef = window.fsDoc(window.db, "meridian", "dashboard");
                await window.fsSetDoc(docRef, { 
                    sites,
                    lastUpdated: new Date().toISOString()
                }, { merge: true });
                
                b.textContent = '✓ Saved to Cloud';
                b.style.color = '#7EB4D8';
            } catch (e) {
                console.error("Error saving to Firestore:", e);
                b.textContent = '✖ Save Failed';
                b.style.color = '#f44336';
                notif("Failed to save to cloud");
            }
        }

        // ── CALCULATIONS ──────────────────────────────────────────────────────────────
        function calc(i) {
            const s = sites[i];
            const rec = s.cash.reduce((a, r) => a + r.amt, 0);
            let matExp = 0;
            MAT.forEach(c => { matExp += s.mat[c].reduce((a, r) => a + r.amt, 0); });
            let labExp = 0;
            LAB.forEach(c => {
                const lb = s.lab[c];
                labExp += (lb.contract !== null ? lb.contract : lb.daily.reduce((a, r) => a + r.amt, 0));
            });
            const exp = matExp + labExp;
            const prof = Math.round(exp * PT);
            const bal = Math.round(rec - exp - prof);
            return { rec, matExp, labExp, exp, prof, bal };
        }

        function fmt(n) {
            if (n === null || n === undefined) return '—';
            const v = Math.round(n);
            return '\u20B9' + v.toLocaleString('en-IN');
        }

        function fmtDate(d) {
            if (!d) return '—';
            try { const p = d.split('-'); return p[2] + '-' + ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][+p[1] - 1] + '-' + p[0]; }
            catch { return d; }
        }

        // ── TAB NAVIGATION ────────────────────────────────────────────────────────────
        function showTab(t) {
            document.getElementById('view-dash').style.display = t === 'dash' ? 'block' : 'none';
            document.getElementById('view-sites').style.display = t === 'sites' ? 'block' : 'none';
            document.getElementById('nt-dash').className = 'nav-tab' + (t === 'dash' ? ' on' : '');
            document.getElementById('nt-sites').className = 'nav-tab' + (t === 'sites' ? ' on' : '');
            if (t === 'dash') renderDash();
            if (t === 'sites') renderSites();
        }

        // ── DASHBOARD ─────────────────────────────────────────────────────────────────
        function renderDash() {
            let tR = 0, tE = 0, tP = 0, tB = 0;
            sites.forEach((_, i) => { const c = calc(i); tR += c.rec; tE += c.exp; tP += c.prof; tB += c.bal; });
            document.getElementById('dashCards').innerHTML = `
    <div class="dcard"><div class="dl">Total Receipts</div><div class="dv dv-green">${fmt(tR)}</div></div>
    <div class="dcard"><div class="dl">Total Expenditure</div><div class="dv dv-red">${fmt(tE)}</div></div>
    <div class="dcard"><div class="dl">Total Profit (15%)</div><div class="dv dv-amber">${fmt(tP)}</div></div>
    <div class="dcard"><div class="dl">Net Balance</div><div class="dv dv-blue">${fmt(tB)}</div></div>`;
            let rows = '';
            sites.forEach((s, i) => {
                const c = calc(i);
                const hasSC = LAB.some(lc => s.lab[lc].contract !== null);
                const bc = c.bal >= 0 ? 'bal-p' : 'bal-n';
                rows += `<tr>
      <td><span class="site-lnk" onclick="goSite(${i})">${s.name}</span>${hasSC ? '<span class="sc-pill">SC</span>' : ''}</td>
      <td>${fmt(c.rec)}</td><td>${fmt(c.exp)}</td><td>${fmt(c.prof)}</td>
      <td class="${bc}">${fmt(c.bal)}</td></tr>`;
            });
            rows += `<tr class="gt"><td>GRAND TOTAL — ALL SITES</td><td>${fmt(tR)}</td><td>${fmt(tE)}</td><td>${fmt(tP)}</td><td>${fmt(tB)}</td></tr>`;
            document.getElementById('dashBody').innerHTML = rows;
        }

        function goSite(i) {
            showTab('sites');
            openSite = i;
            renderSites();
            setTimeout(() => {
                const el = document.getElementById('sc-' + i);
                if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 80);
        }

        // ── SITES LIST ────────────────────────────────────────────────────────────────
        function renderSites() {
            const wrap = document.getElementById('sitesList');
            wrap.innerHTML = '';
            sites.forEach((s, i) => {
                const { rec, exp, bal } = calc(i);
                const isOpen = openSite === i;
                const hasSC = LAB.some(lc => s.lab[lc].contract !== null);
                const bc = bal >= 0 ? 'bal-p' : 'bal-n';
                const div = document.createElement('div');
                div.className = 'site-card'; div.id = 'sc-' + i;
                div.innerHTML = `
      <div class="site-hdr${isOpen ? ' open' : ''}" onclick="toggleSite(${i})">
        <div class="snum">${String(i + 1).padStart(2, '0')}</div>
        <div class="sinfo">
          <div class="sname">${esc(s.name)}${hasSC ? '<span class="sc-pill">Subcontract</span>' : ''}</div>
          <div class="smeta">Receipts: ${fmt(rec)} &nbsp;|&nbsp; Expense: ${fmt(exp)} &nbsp;|&nbsp; <span class="${bc}">Balance: ${fmt(bal)}</span></div>
        </div>
        <div class="site-actions" onclick="event.stopPropagation()">
          <button class="btn btn-outline" style="font-size:10px;padding:4px 8px" onclick="renameSite(${i})">Rename</button>
        </div>
        <span class="sarr">&#9654;</span>
      </div>
      <div class="site-body${isOpen ? ' open' : ''}" id="sb-${i}">${isOpen ? bodyHTML(i) : ''}</div>`;
                wrap.appendChild(div);
            });
        }

        function toggleSite(i) {
            openSite = (openSite === i) ? null : i;
            renderSites();
        }

        // ── SITE BODY ─────────────────────────────────────────────────────────────────
        function bodyHTML(i) {
            const sec = openSec[i] || 'cash';
            return `
    <div class="sec-tabs">
      ${['cash', 'mat', 'lab', 'sum'].map((s, j) => `<div class="sec-tab${sec === s ? ' on' : ''}" onclick="setSec(${i},'${s}')">${['&#128176; Cash', '&#129521; Materials', '&#128119; Labour', '&#128202; Summary'][j]}</div>`).join('')}
    </div>
    <div class="sec-panel${sec === 'cash' ? ' on' : ''}">${sec === 'cash' ? cashHTML(i) : ''}</div>
    <div class="sec-panel${sec === 'mat' ? ' on' : ''}">${sec === 'mat' ? matHTML(i) : ''}</div>
    <div class="sec-panel${sec === 'lab' ? ' on' : ''}">${sec === 'lab' ? labHTML(i) : ''}</div>
    <div class="sec-panel${sec === 'sum' ? ' on' : ''}">${sec === 'sum' ? sumHTML(i) : ''}</div>`;
        }

        function setSec(i, sec) {
            openSec[i] = sec;
            document.getElementById('sb-' + i).innerHTML = bodyHTML(i);
        }

        // ── CASH ──────────────────────────────────────────────────────────────────────
        function cashHTML(i) {
            const rows = sites[i].cash;
            const tot = rows.reduce((a, r) => a + r.amt, 0);
            return `
    <div class="form-row fg3">
      <div class="fi"><label>Date</label><input type="date" id="cd-${i}"></div>
      <div class="fi"><label>Particulars</label><input type="text" id="cp-${i}" placeholder="Running bill, advance, final payment..."></div>
      <div class="fi"><label>Amount (&#8377;)</label><input type="number" id="ca-${i}" placeholder="0" min="0"></div>
    </div>
    <button class="btn btn-green" onclick="addCash(${i})">+ Add Receipt</button>
    <div class="tbl-wrap"><table class="etbl">
      <thead><tr><th style="width:5%">#</th><th style="width:18%">Date</th><th>Particulars</th><th class="r" style="width:22%">Amount (&#8377;)</th><th style="width:5%"></th></tr></thead>
      <tbody>
        ${rows.length === 0 ? '<tr class="empty-row"><td colspan="5">No receipts entered yet</td></tr>' : ''}
        ${rows.map((r, j) => `<tr>
          <td class="muted">${j + 1}</td>
          <td>${fmtDate(r.date)}</td>
          <td>${esc(r.part) || '—'}</td>
          <td class="r">${fmt(r.amt)}</td>
          <td><button class="del-btn" onclick="delEntry(${i},'cash',${j})">&#10005;</button></td>
        </tr>`).join('')}
        ${rows.length > 0 ? `<tr class="sub-row"><td colspan="3">Total Receipts</td><td class="r">${fmt(tot)}</td><td></td></tr>` : ''}
      </tbody>
    </table></div>`;
        }

        function addCash(i) {
            const d = document.getElementById('cd-' + i).value;
            const p = document.getElementById('cp-' + i).value.trim();
            const a = parseFloat(document.getElementById('ca-' + i).value) || 0;
            if (!a) { notif('Enter an amount'); return; }
            sites[i].cash.push({ date: d, part: p, amt: a });
            save(); refreshBody(i, 'cash'); refreshHdr(i); notif('Receipt added');
        }

        // ── MATERIALS ─────────────────────────────────────────────────────────────────
        function matHTML(i) {
            const cat = openCat['m' + i] || MAT[0];
            const rows = sites[i].mat[cat];
            const sub = rows.reduce((a, r) => a + r.amt, 0);
            return `
    <div class="cat-tabs">${MAT.map(c => `<div class="ctab${cat === c ? ' on' : ''}" onclick="setCat(${i},'m','${c}')">${c}</div>`).join('')}</div>
    <div class="form-row fg3">
      <div class="fi"><label>Date</label><input type="date" id="md-${i}"></div>
      <div class="fi"><label>Details / Vendor Name</label><input type="text" id="mdt-${i}" placeholder="Vendor or description"></div>
      <div class="fi"><label>Amount (&#8377;)</label><input type="number" id="ma-${i}" placeholder="0" min="0"></div>
    </div>
    <button class="btn btn-blue" onclick="addMat(${i},'${cat}')">+ Add ${cat} Entry</button>
    <div class="tbl-wrap"><table class="etbl">
      <thead><tr><th style="width:5%">#</th><th style="width:18%">Date</th><th>Details / Vendor</th><th class="r" style="width:22%">Amount (&#8377;)</th><th style="width:5%"></th></tr></thead>
      <tbody>
        ${rows.length === 0 ? `<tr class="empty-row"><td colspan="5">No ${cat} entries yet</td></tr>` : ''}
        ${rows.map((r, j) => `<tr>
          <td class="muted">${j + 1}</td>
          <td>${fmtDate(r.date)}</td>
          <td>${esc(r.det) || '—'}</td>
          <td class="r">${fmt(r.amt)}</td>
          <td><button class="del-btn" onclick="delEntry(${i},'mat-${cat}',${j})">&#10005;</button></td>
        </tr>`).join('')}
        ${rows.length > 0 ? `<tr class="sub-row"><td colspan="3">Sub Total — ${cat}</td><td class="r">${fmt(sub)}</td><td></td></tr>` : ''}
      </tbody>
    </table></div>`;
        }

        function addMat(i, cat) {
            const d = document.getElementById('md-' + i).value;
            const dt = document.getElementById('mdt-' + i).value.trim();
            const a = parseFloat(document.getElementById('ma-' + i).value) || 0;
            if (!a) { notif('Enter an amount'); return; }
            sites[i].mat[cat].push({ date: d, det: dt, amt: a });
            save(); refreshBody(i, 'mat'); refreshHdr(i); notif(cat + ' entry added');
        }

        // ── LABOUR ────────────────────────────────────────────────────────────────────
        function labHTML(i) {
            const cat = openCat['l' + i] || LAB[0];
            const lb = sites[i].lab[cat];
            const isSC = lb.contract !== null;
            const sub = isSC ? lb.contract : lb.daily.reduce((a, r) => a + r.amt, 0);
            return `
    <div class="cat-tabs">${LAB.map(c => {
                const hasSC = sites[i].lab[c].contract !== null;
                return `<div class="ctab${cat === c ? ' on' : ''}" onclick="setCat(${i},'l','${c}')">${c}${hasSC ? '<span class="sc-pill" style="margin-left:4px">SC</span>' : ''}</div>`;
            }).join('')}</div>
    <div class="mode-toggle">
      <button class="mtbtn${!isSC ? ' on' : ''}" onclick="setMode(${i},'${cat}',false)">&#128467; Daily Entry</button>
      <button class="mtbtn${isSC ? ' on-sc' : ''}" onclick="setMode(${i},'${cat}',true)">&#128196; Subcontract</button>
    </div>
    ${isSC ? `
      <div class="sc-box">
        <div class="sc-box-title">&#128196; Subcontract Details — ${cat}</div>
        <div class="form-row fg3">
          <div class="fi"><label>Subcontractor Name</label><input type="text" id="scn-${i}" value="${esc(lb.scName || '')}" placeholder="Contractor name"></div>
          <div class="fi"><label>Contract Amount (&#8377;)</label><input type="number" id="sca-${i}" value="${lb.contract || ''}" placeholder="Total contract value" min="0"></div>
          <div class="fi"><label>Work Description</label><input type="text" id="scd-${i}" value="${esc(lb.scDesc || '')}" placeholder="Scope of work"></div>
        </div>
        <button class="btn btn-purple" onclick="saveContract(${i},'${cat}')">Save Contract</button>
        <div class="sc-note">&#9432; The full contract amount is taken as the labour cost. No daily entries needed.</div>
      </div>
      <div class="tbl-wrap"><table class="etbl">
        <thead><tr><th>Item</th><th>Subcontractor</th><th class="r">Amount (&#8377;)</th></tr></thead>
        <tbody>
          ${lb.contract ? `
            <tr class="sc-row"><td>Subcontract — ${cat}</td><td>${esc(lb.scName) || '—'}</td><td class="r">${fmt(lb.contract)}</td></tr>`
                        : '<tr class="empty-row"><td colspan="3">Enter contract amount above and click Save</td></tr>'}
        </tbody>
      </table></div>`: `
      <div class="form-row fg3">
        <div class="fi"><label>Date</label><input type="date" id="ld-${i}"></div>
        <div class="fi"><label>Particulars / Worker</label><input type="text" id="lp-${i}" placeholder="Worker name or work details"></div>
        <div class="fi"><label>Amount (&#8377;)</label><input type="number" id="la-${i}" placeholder="0" min="0"></div>
      </div>
      <button class="btn btn-blue" onclick="addLab(${i},'${cat}')">+ Add ${cat} Entry</button>
      <div class="tbl-wrap"><table class="etbl">
        <thead><tr><th style="width:5%">#</th><th style="width:18%">Date</th><th>Particulars</th><th class="r" style="width:22%">Amount (&#8377;)</th><th style="width:5%"></th></tr></thead>
        <tbody>
          ${lb.daily.length === 0 ? `<tr class="empty-row"><td colspan="5">No ${cat} entries yet</td></tr>` : ''}
          ${lb.daily.map((r, j) => `<tr>
            <td class="muted">${j + 1}</td>
            <td>${fmtDate(r.date)}</td>
            <td>${esc(r.part) || '—'}</td>
            <td class="r">${fmt(r.amt)}</td>
            <td><button class="del-btn" onclick="delEntry(${i},'lab-${cat}',${j})">&#10005;</button></td>
          </tr>`).join('')}
          ${lb.daily.length > 0 ? `<tr class="sub-row"><td colspan="3">Sub Total — ${cat}</td><td class="r">${fmt(sub)}</td><td></td></tr>` : ''}
        </tbody>
      </table></div>`}`;
        }

        function addLab(i, cat) {
            const d = document.getElementById('ld-' + i).value;
            const p = document.getElementById('lp-' + i).value.trim();
            const a = parseFloat(document.getElementById('la-' + i).value) || 0;
            if (!a) { notif('Enter an amount'); return; }
            sites[i].lab[cat].daily.push({ date: d, part: p, amt: a });
            save(); refreshBody(i, 'lab'); refreshHdr(i); notif(cat + ' entry added');
        }

        function setMode(i, cat, isSC) {
            const lb = sites[i].lab[cat];
            if (isSC) { if (lb.contract === null) lb.contract = 0; }
            else lb.contract = null;
            save(); refreshBody(i, 'lab');
        }

        function saveContract(i, cat) {
            const lb = sites[i].lab[cat];
            lb.scName = document.getElementById('scn-' + i).value.trim();
            lb.contract = parseFloat(document.getElementById('sca-' + i).value) || 0;
            lb.scDesc = document.getElementById('scd-' + i).value.trim();
            save(); refreshBody(i, 'lab'); refreshHdr(i); notif('Contract saved');
        }

        // ── SUMMARY ───────────────────────────────────────────────────────────────────
        function sumHTML(i) {
            const { rec, matExp, labExp, exp, prof, bal } = calc(i);
            const mRows = MAT.map(c => {
                const s = sites[i].mat[c].reduce((a, r) => a + r.amt, 0);
                return `<tr><td>${c}</td><td class="r">${fmt(s)}</td><td class="r">${fmt(Math.round(s * (1 + PT)))}</td></tr>`;
            }).join('');
            const lRows = LAB.map(c => {
                const lb = sites[i].lab[c];
                const isSC = lb.contract !== null;
                const s = isSC ? lb.contract : lb.daily.reduce((a, r) => a + r.amt, 0);
                return `<tr><td>${c}${isSC ? '<span class="sc-pill">SC</span>' : ''}</td><td class="r">${fmt(s)}</td><td class="r">${fmt(Math.round(s * (1 + PT)))}</td></tr>`;
            }).join('');
            return `
    <div class="sum-grid">
      <div class="scard sg"><div class="sl">Total Receipts</div><div class="sv">${fmt(rec)}</div></div>
      <div class="scard sr"><div class="sl">Total Expenditure</div><div class="sv">${fmt(exp)}</div></div>
      <div class="scard sa"><div class="sl">Profit @ 15%</div><div class="sv">${fmt(prof)}</div></div>
      <div class="scard sb"><div class="sl">Net Balance</div><div class="sv">${fmt(bal)}</div></div>
    </div>
    <div class="tbl-wrap" style="margin-bottom:12px"><table class="etbl">
      <thead><tr><th>Material</th><th class="r">Base Amount (&#8377;)</th><th class="r">Incl. 15% Profit (&#8377;)</th></tr></thead>
      <tbody>${mRows}<tr class="sub-row"><td>Total Materials</td><td class="r">${fmt(matExp)}</td><td class="r">${fmt(Math.round(matExp * (1 + PT)))}</td></tr></tbody>
    </table></div>
    <div class="tbl-wrap"><table class="etbl">
      <thead><tr><th>Labour Category</th><th class="r">Base Amount (&#8377;)</th><th class="r">Incl. 15% Profit (&#8377;)</th></tr></thead>
      <tbody>${lRows}<tr class="sub-row"><td>Total Labour</td><td class="r">${fmt(labExp)}</td><td class="r">${fmt(Math.round(labExp * (1 + PT)))}</td></tr></tbody>
    </table></div>`;
        }

        // ── HELPERS ───────────────────────────────────────────────────────────────────
        function setCat(i, type, cat) {
            openCat[type + i] = cat;
            refreshBody(i, type === 'm' ? 'mat' : 'lab');
        }

        function refreshBody(i, sec) {
            openSec[i] = sec || openSec[i] || 'cash';
            const sb = document.getElementById('sb-' + i);
            if (sb) sb.innerHTML = bodyHTML(i);
        }

        function refreshHdr(i) {
            const { rec, exp, bal } = calc(i);
            const card = document.getElementById('sc-' + i);
            if (!card) return;
            const hasSC = LAB.some(lc => sites[i].lab[lc].contract !== null);
            const bc = bal >= 0 ? 'bal-p' : 'bal-n';
            const nm = card.querySelector('.sname');
            const mt = card.querySelector('.smeta');
            if (nm) nm.innerHTML = esc(sites[i].name) + (hasSC ? '<span class="sc-pill">Subcontract</span>' : '');
            if (mt) mt.innerHTML = `Receipts: ${fmt(rec)} &nbsp;|&nbsp; Expense: ${fmt(exp)} &nbsp;|&nbsp; <span class="${bc}">Balance: ${fmt(bal)}</span>`;
        }

        function delEntry(i, type, j) {
            if (!confirm('Delete this entry?')) return;
            if (type === 'cash') sites[i].cash.splice(j, 1);
            else if (type.startsWith('mat-')) { const c = type.slice(4); sites[i].mat[c].splice(j, 1); }
            else if (type.startsWith('lab-')) { const c = type.slice(4); sites[i].lab[c].daily.splice(j, 1); }
            save();
            const sec = type === 'cash' ? 'cash' : type.startsWith('mat') ? 'mat' : 'lab';
            refreshBody(i, sec); refreshHdr(i);
        }

        function toggleAddSite() {
            const b = document.getElementById('addSiteBar');
            b.classList.toggle('open');
            if (b.classList.contains('open')) document.getElementById('newSiteName').focus();
        }

        function addSite() {
            const nm = document.getElementById('newSiteName').value.trim();
            if (!nm) { notif('Enter a site name'); return; }
            sites.push(mkSite(nm));
            document.getElementById('newSiteName').value = '';
            document.getElementById('addSiteBar').classList.remove('open');
            save(); renderSites(); notif(nm + ' added');
        }

        function renameSite(i) {
            const nm = prompt('Rename site:', sites[i].name);
            if (nm && nm.trim()) { sites[i].name = nm.trim(); save(); renderSites(); }
        }

        function clearAllData() {
            if (!confirm('This will DELETE ALL DATA permanently. Are you sure?')) return;
            if (!confirm('Last chance — all entries will be lost!')) return;
            localStorage.removeItem(STORE_KEY);
            sites = [];
            for (let i = 1; i <= 20; i++) sites.push(mkSite('Site ' + i));
            openSite = null; openSec = {}; openCat = {};
            save(); renderSites(); renderDash(); notif('All data cleared');
        }

        function esc(s) {
            if (!s) return '';
            return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function notif(msg) {
            const el = document.getElementById('notif');
            el.textContent = msg; el.classList.add('show');
            clearTimeout(notif._t);
            notif._t = setTimeout(() => el.classList.remove('show'), 2000);
        }

        // ── EXCEL EXPORT ──────────────────────────────────────────────────────────────
        function exportExcel() {
            const wb = XLSX.utils.book_new();
            const hStyle = { font: { bold: true, color: { rgb: 'FFFFFF' } }, fill: { fgColor: { rgb: '1A3C5E' } }, alignment: { horizontal: 'center' } };
            const subStyle = { font: { bold: true }, fill: { fgColor: { rgb: 'D6E4F0' } } };
            const pftStyle = { fill: { fgColor: { rgb: 'FFFBE6' } } };
            const gtStyle = { font: { bold: true, color: { rgb: 'FFFFFF' } }, fill: { fgColor: { rgb: '1F4E79' } } };

            // Dashboard sheet
            const dashData = [['MERIDIAN CONSTRUCTION — SITE DASHBOARD'], [''],
            ['Site', 'Total Receipts (₹)', 'Total Expense (₹)', 'Profit 15% (₹)', 'Balance (₹)']];
            let tR = 0, tE = 0, tP = 0, tB = 0;
            sites.forEach((s, i) => {
                const c = calc(i); tR += c.rec; tE += c.exp; tP += c.prof; tB += c.bal;
                dashData.push([s.name, c.rec, c.exp, c.prof, c.bal]);
            });
            dashData.push(['GRAND TOTAL', tR, tE, tP, tB]);
            const ws0 = XLSX.utils.aoa_to_sheet(dashData);
            ws0['!cols'] = [{ wch: 30 }, { wch: 20 }, { wch: 20 }, { wch: 20 }, { wch: 20 }];
            XLSX.utils.book_append_sheet(wb, ws0, 'Dashboard');

            // Per-site sheets
            sites.forEach((s, i) => {
                const { rec, matExp, labExp, exp, prof, bal } = calc(i);
                const rows = [[s.name.toUpperCase() + ' — INCOME & EXPENDITURE'], ['']];

                // Cash
                rows.push(['CASH RECEIPTS', '', '']);
                rows.push(['Date', 'Particulars', 'Amount (₹)']);
                s.cash.forEach(r => rows.push([r.date || '', r.part || '', r.amt]));
                rows.push(['Total Receipts', '', rec]);
                rows.push(['']);

                // Materials
                rows.push(['MATERIAL PURCHASES', '', '', '', '', '']);
                MAT.forEach(cat => {
                    const entries = s.mat[cat];
                    const sub = entries.reduce((a, r) => a + r.amt, 0);
                    rows.push([cat, '', '']);
                    rows.push(['Date', 'Details/Vendor', 'Amount (₹)']);
                    entries.forEach(r => rows.push([r.date || '', r.det || '', r.amt]));
                    rows.push(['Sub Total — ' + cat, '', sub]);
                    rows.push(['']);
                });

                // Labour
                rows.push(['LABOUR COSTS', '', '']);
                LAB.forEach(cat => {
                    const lb = s.lab[cat];
                    const isSC = lb.contract !== null;
                    const sub = isSC ? lb.contract : lb.daily.reduce((a, r) => a + r.amt, 0);
                    rows.push([cat + (isSC ? ' [SUBCONTRACT]' : ''), '', '']);
                    if (isSC) {
                        rows.push(['Subcontractor', lb.scName || '', '']);
                        rows.push(['Contract Amount', '', lb.contract]);
                    } else {
                        rows.push(['Date', 'Particulars', 'Amount (₹)']);
                        lb.daily.forEach(r => rows.push([r.date || '', r.part || '', r.amt]));
                    }
                    rows.push(['Sub Total — ' + cat, '', sub]);
                    rows.push(['']);
                });

                // Summary
                rows.push(['SUMMARY', '', '']);
                rows.push(['Total Receipts', '', rec]);
                rows.push(['Total Expenditure', '', exp]);
                rows.push(['Profit @ 15%', '', prof]);
                rows.push(['NET BALANCE', '', bal]);

                const wsn = s.name.replace(/[:\\\/?*\[\]]/g, '').substring(0, 28);
                const ws = XLSX.utils.aoa_to_sheet(rows);
                ws['!cols'] = [{ wch: 28 }, { wch: 28 }, { wch: 18 }];
                XLSX.utils.book_append_sheet(wb, ws, wsn || (i + 1));
            });

            const d = new Date();
            const ds = d.getDate() + '-' + ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][d.getMonth()] + '-' + d.getFullYear();
            XLSX.writeFile(wb, 'Meridian_IE_' + ds + '.xlsx');
            notif('Excel exported!');
        }

        // ── BOOT ──────────────────────────────────────────────────────────────────────
        // ── BOOT ──────────────────────────────────────────────────────────────────────
        // Wait for Firebase to be ready before loading
        window.addEventListener('load', () => {
            const checkFirebase = setInterval(() => {
                if (window.db) {
                    clearInterval(checkFirebase);
                    load();
                    showTab('dash');
                }
            }, 100);
        });
    </script>
</body>
